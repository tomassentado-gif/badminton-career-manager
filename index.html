<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>Badminton Career Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Badminton Career Manager">
        <span class="brand-mark">BCM</span>
        <span><strong>BADMINTON</strong><small>CAREER MANAGER</small></span>
      </a>
      <div class="season-label">ÉPOCA 2026 / 27</div>
      <nav id="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-page="inicio"><span>◈</span> Visão geral</button>
        <button class="nav-item" data-page="jogador"><span>◎</span> Jogador</button>
        <button class="nav-item" data-page="treino"><span>↗</span> Treino</button>
        <button class="nav-item" data-page="calendario"><span>▦</span> Calendário</button>
        <button class="nav-item" data-page="competicoes"><span>♜</span> Competições</button>
        <button class="nav-item" data-page="ranking"><span>⌁</span> Rankings</button>
        <button class="nav-item" data-page="financas"><span>€</span> Finanças</button>
        <button class="nav-item" data-page="historico"><span>▤</span> Histórico</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span> Carreira local <span class="save-label">Auto-save</span></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><div class="eyebrow">CENTRO DE ALTO RENDIMENTO</div><div class="top-title" id="top-title">Visão geral</div></div>
        <div class="top-right"><span class="season-chip">2026 / 27</span><div class="avatar" id="top-avatar">?</div></div>
      </header>
      <section id="page-content" class="page-content"></section>
      <footer>BADMINTON CAREER MANAGER <span>Uma carreira. Um objetivo.</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
